[project]
name = "ai-timeline"
version = "0.1.0"
description = "Runnable, checked examples from the history of AI, published as a website."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "ipykernel>=7.3.0,<8.0.0",
    "jupyter-book>=2.1.6,<3.0.0",
    "jupyterlab>=4.6.3,<5.0.0",
    "pillow>=12.3.0,<13.0.0",
    "pyswip>=0.3.3,<0.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
