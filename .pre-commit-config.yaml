repos:
  - repo: local
    hooks:
      - id: build-site
        name: build site (runs every chapter and widget test)
        entry: poetry run python scripts/build_site.py
        language: system
        pass_filenames: false
        files: '^(chapters/|widgets/|scripts/build_site\.py|index\.md|myst\.yml|pyproject\.toml|poetry\.lock|\.python-version)'
